version: "3.9"

networks:
  iceberg_network:
    driver: bridge

services:
  # --- Airflow metadata database ---
  airflow-db:
    container_name: airflow-db
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: airflow
      PGUSER: ${PG_USER}
      PGPASSWORD: ${PG_PASS}
      PGDATABASE: airflow
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata_airflow:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      retries: 5
    restart: always

  # --- Separate Postgres for weather tracking ---
  weather-db:
    container_name: weather-db
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${POSTGRES_WEATHER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_WEATHER_PASS}
      POSTGRES_DB: weather_db
      PGUSER: ${PG_WEATHER_USER}
      PGPASSWORD: ${PG_WEATHER_PASS}
      PGDATABASE: weather_db
    ports:
      - "5433:5432"
    volumes:
      - ./pgdata_weather:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather_user -d weather_db"]
      interval: 10s
      retries: 5
    restart: always

  # --- pgAdmin UI for both databases ---
  pgadmin:
    container_name: pgadmin1
    image: elestio/pgadmin:REL-8_10
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG_ADMIN}
      PGADMIN_DEFAULT_PASSWORD: ${PG_ADMIN_PASS}
      CSRF_ENABLED: "False"
    ports:
      - "5050:80"
    depends_on:
      - airflow-db
      - weather-db

  # --- Airflow Webserver ---
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: apache/airflow:2.8.1
    container_name: airflow-webserver
    command: webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW_CONN_WEATHER_DB: postgresql+psycopg2://weather_user:weather_pass@weather-db:5432/weather_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ./dbt/seeds:/opt/airflow/dbt/seeds
      - ./minio_data:/data # this line is added by Meik
      - ./duckdb_lab:/opt/airflow/db  # this line is added by Meik, <— persistent DuckDB volume
    depends_on:
      - airflow-init
      - airflow-db
      - weather-db
      - minio
    restart: always

  # --- Airflow Scheduler ---
  airflow-scheduler:
    image: apache/airflow:2.8.1
    container_name: airflow-scheduler
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW_CONN_WEATHER_DB: postgresql+psycopg2://weather_user:weather_pass@weather-db:5432/weather_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ./dbt/seeds:/opt/airflow/dbt/seeds
      - ./minio_data:/data # this line is added by Meik
      - ./duckdb_lab:/opt/airflow/db  # <— persistent DuckDB volume
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - airflow-init
      - airflow-db
      - weather-db
      - minio
    restart: always

  # --- Airflow DB initialization & user setup ---
  airflow-init:
    image: apache/airflow:2.8.1
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
    depends_on:
      - airflow-db
      - weather-db
      - minio
    restart: "no"

  clickhouse-server:
    image: clickhouse/clickhouse-server
    container_name: clickhouse-server
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASS}
      CLICKHOUSE_DB: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
    #   - ./sample_data:/var/lib/clickhouse/user_files
      - ./sql:/sql
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/ping"]
      interval: 5s
      retries: 20

  dbt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dbt
    depends_on:
      - minio #clickhouse-server
    volumes:
      # - ./sample_data:/var/lib/clickhouse/user_files
      - ./sql:/sql
      - ./dbt:/dbt
      - ./minio_data:/data #added by Meik
    working_dir: /dbt
    tty: true


  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: minio
    ports:
      - "9500:9500"   # MinIO API
      - "9501:9501"   # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data
    networks:
      iceberg_network:
        aliases:
          - minio

  duckdb_lab:
    build:
      context: .
      dockerfile: Dockerfile
    # build: .
    container_name: duckdb_lab
    volumes:
      - ./sample_data:/lab/sample_data
      - ./scripts:/lab/scripts
    depends_on:
      - minio
      - iceberg_rest
    stdin_open: true
    tty: true
    environment:
      PYICEBERG_HOME: /lab/sample_data
      PYICEBERG_CATALOG__REST__URI: http://iceberg_rest:8181/
      PYICEBERG_CATALOG__REST__WAREHOUSE: s3://project-bucket/
      PYICEBERG_CATALOG__REST__IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      PYICEBERG_CATALOG__REST__S3__ENDPOINT: http://minio:9000
      PYICEBERG_CATALOG__REST__S3__ACCESS-KEY-ID: minioadmin
      PYICEBERG_CATALOG__REST__S3__SECRET-ACCESS-KEY: minioadmin

    networks:
      - iceberg_network

  iceberg_rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: iceberg_rest
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      AWS_ENDPOINT: http://minio:9000

      CATALOG__REST__URI: http://iceberg_rest:8181/
      CATALOG__REST__WAREHOUSE: s3://project-bucket/
      CATALOG__REST__IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG__REST__S3__ENDPOINT: http://minio:9000
      CATALOG__REST__S3__ACCESS-KEY-ID: minioadmin
      CATALOG__REST__S3__SECRET-ACCESS-KEY: minioadmin

    depends_on:
      - minio
    networks:
      iceberg_network:


volumes:
  pgdata_airflow:
  pgdata_weather:


